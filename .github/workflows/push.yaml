name: push
on:
  push:
    branches: ["*"]
env:
  TERM: xterm-color
jobs:
  push:
    name: Push Workflow
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Build Toolbox image
      run: make build
    - name: Lint shell files
      run: make shell-lint
    - name: Draft release
      if: github.ref == 'refs/heads/master'
      uses: release-drafter/release-drafter@v6
      with:
        config-name: release-config.yaml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-validation:
    name: Container Validation (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build image for architecture
      run: |
        docker buildx build \
          --build-arg TOOLBOX_VERSION=ci-test \
          --tag toolbox:test-${{ matrix.arch }} \
          --load .
    - name: Install container-structure-test
      run: |
        curl -fsSL https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.21.1/container-structure-test-linux-amd64 \
          -o /usr/local/bin/container-structure-test
        chmod +x /usr/local/bin/container-structure-test
    - name: Verify image tools
      run: container-structure-test test --image toolbox:test-${{ matrix.arch }} --config .github/container-structure-test.yaml
