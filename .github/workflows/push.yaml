name: push
on:
  push:
    branches: ["*"]
env:
  TERM: xterm-color
jobs:
  push:
    name: Push Workflow
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Build Toolbox image
      run: make build
    - name: Lint shell files
      run: make shell-lint
    - name: Draft release
      if: github.ref == 'refs/heads/master'
      uses: release-drafter/release-drafter@v6
      with:
        config-name: release-config.yaml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-validation:
    name: Container Validation (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build image for architecture
      run: |
        docker buildx build \
          --build-arg TOOLBOX_VERSION=ci-test \
          --tag toolbox:test-${{ matrix.arch }} \
          --load .
    - name: Verify image tools
      run: |
        # Verify each required tool is present in the image
        docker run --rm toolbox:test-${{ matrix.arch }} aws --version
        docker run --rm toolbox:test-${{ matrix.arch }} terraform --version
        docker run --rm toolbox:test-${{ matrix.arch }} shellcheck --version
        docker run --rm toolbox:test-${{ matrix.arch }} shfmt --version
        docker run --rm toolbox:test-${{ matrix.arch }} yq --version
        docker run --rm toolbox:test-${{ matrix.arch }} schma --version
        docker run --rm toolbox:test-${{ matrix.arch }} snyk --version
        docker run --rm toolbox:test-${{ matrix.arch }} buildkite-agent --version
        docker run --rm toolbox:test-${{ matrix.arch }} toolbox --version
        docker run --rm toolbox:test-${{ matrix.arch }} docker --version
        docker run --rm toolbox:test-${{ matrix.arch }} git --version
        docker run --rm toolbox:test-${{ matrix.arch }} jq --version
        docker run --rm toolbox:test-${{ matrix.arch }} make --version
